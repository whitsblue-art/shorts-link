name: Shopping source diagnostics
on:
  push:
    branches: [main]
    paths: ['.github/workflows/shopping_source_probe.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests==2.32.5
      - name: Inspect public product identity without generating or publishing
        env:
          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
          COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from shopping.coupang import Coupang
          from shopping.core import atomic_json
          products = Coupang().search('코브라 수전 헤드', limit=4)
          public = [{k: p[k] for k in ('product_id','title','reference_image','canonical_url')} for p in products]
          atomic_json(Path('source_diagnostics/products.json'), public)
          print('PUBLIC_PRODUCT_IDENTITIES=' + json.dumps(public, ensure_ascii=False), flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shopping-source-diagnostics
          path: source_diagnostics/
          retention-days: 7
