name: Shopping connection check
on:
  push:
    branches: [main, 'shopping/verified-pipeline-20261031']
    paths: ['.github/workflows/shopping_connections.yml', 'shopping_config.json', 'shopping/connections.py', 'shopping/channel.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  connections:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: 키와 계정 연결 검사 (게시 없음)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
          COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
          SHOPPING_YOUTUBE_TOKEN_JSON: ${{ secrets.SHOPPING_YOUTUBE_TOKEN_JSON }}
          SHOPPING_CHANNEL_URL: ${{ vars.SHOPPING_CHANNEL_URL }}
        run: python -m shopping.connections
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shopping-connection-report
          path: current_episode/connection_report.json
          retention-days: 7
