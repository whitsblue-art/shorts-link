name: OpenAI capability check
on:
  push:
    branches: [main, shopping/openai-migration-20261031]
    paths: ['.github/workflows/shopping_model_probe.yml', 'shopping/openai_probe.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  openai:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      MAX_AI_REQUESTS: '12'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-nanum
      - run: python -m pip install -r requirements.txt
      - name: Real text, vision, search and original-audio checks
        run: python -m shopping.openai_probe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: openai-capabilities-${{ github.run_id }}-${{ github.run_attempt }}
          path: current_episode/
          retention-days: 7
