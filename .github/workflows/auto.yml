name: Auto Shop-the-Look Runner

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install FFmpeg, Korean Fonts & Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-nanum
          pip install requests pillow edge-tts

      - name: Run catalog & video automation
        run: |
          python main.py
          python video_maker.py

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add products.json videos/*.mp4
          git commit -m "🤖 자동화 로봇: 다중 씬 고화질 쇼츠 및 상품 업데이트" || echo "No changes to commit"
          git push
