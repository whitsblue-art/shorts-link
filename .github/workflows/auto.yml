name: Auto Shop-the-Look Runner

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-nanum
          python3 -m pip install --upgrade pip
          python3 -m pip install requests pillow gTTS edge-tts

      - name: Run Automation Scripts
        run: |
          python3 main.py
          python3 video_maker.py

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add products.json videos/*.mp4
          git commit -m "🤖 자동화 로봇: 상품 및 쇼츠 영상 업데이트" || echo "No changes"
          git pull --rebase origin main || true
          git push
