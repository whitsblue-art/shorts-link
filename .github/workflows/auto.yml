name: Zero-Click Shopper Bot

on:
  workflow_dispatch:
    inputs:
      publish:
        description: '검수 완료 영상의 카탈로그 반영 및 쇼핑 채널 게시'
        type: boolean
        default: false
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write
  actions: read
  pages: write
  id-token: write

concurrency:
  group: shopping-publication
  cancel-in-progress: false

jobs:
  shopping:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
      COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
      SHOPPING_CHANNEL_URL: ${{ vars.SHOPPING_CHANNEL_URL }}
      DO_PUBLISH: ${{ (github.event_name == 'workflow_dispatch' && inputs.publish) || (github.event_name == 'schedule' && vars.SHOPPING_AUTOPUBLISH == 'true') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-nanum
          python -m pip install -r requirements.txt
      - name: Compile Python
        run: python -m compileall -q main.py video_maker.py shopping
      - name: Verify channel connection before preparing a publication
        if: env.DO_PUBLISH == 'true'
        env:
          SHOPPING_YOUTUBE_TOKEN_JSON: ${{ secrets.SHOPPING_YOUTUBE_TOKEN_JSON }}
        run: python -m shopping.check_channel
      - name: Source, verify and render three scenes
        id: prepare
        shell: bash
        run: |
          if [ "$DO_PUBLISH" = 'true' ]; then
            python main.py --prepare --publish
          else
            python main.py --prepare
          fi
      - name: Save reviewed video and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-${{ github.run_id }}-${{ github.run_attempt }}
          path: current_episode/
          if-no-files-found: warn
          retention-days: 30
      - name: Commit catalog and three verified product images
        if: env.DO_PUBLISH == 'true' && steps.prepare.outputs.ready == 'true'
        env:
          EPISODE_ID: ${{ steps.prepare.outputs.episode_id }}
        run: python main.py --register-catalogue --episode "$EPISODE_ID"
      - name: Configure catalog hosting
        if: env.DO_PUBLISH == 'true' && steps.prepare.outputs.ready == 'true'
        uses: actions/configure-pages@v5
      - name: Upload catalog site
        if: env.DO_PUBLISH == 'true' && steps.prepare.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy public catalog
        if: env.DO_PUBLISH == 'true' && steps.prepare.outputs.ready == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify live catalog, upload privately, verify processing, then publish
        if: env.DO_PUBLISH == 'true' && steps.prepare.outputs.ready == 'true'
        env:
          EPISODE_ID: ${{ steps.prepare.outputs.episode_id }}
          SHOPPING_YOUTUBE_TOKEN_JSON: ${{ secrets.SHOPPING_YOUTUBE_TOKEN_JSON }}
        run: python main.py --release --episode "$EPISODE_ID"
