<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>스마트세이버 추천 꿀템</title>
  <style>
    body {
      background-color: #121212;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      margin: 0;
      padding: 30px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container {
      width: 100%;
      max-width: 480px;
    }
    h1 {
      color: #f5b000;
      text-align: center;
      font-size: 26px;
      margin-bottom: 8px;
    }
    .subtitle {
      color: #a0a0a0;
      text-align: center;
      font-size: 14px;
      margin-bottom: 24px;
    }
    .search-box {
      width: 100%;
      padding: 14px 18px;
      border-radius: 30px;
      border: 1px solid #333;
      background-color: #1e1e1e;
      color: #fff;
      font-size: 15px;
      box-sizing: border-box;
      margin-bottom: 24px;
      outline: none;
    }
    .search-box:focus {
      border-color: #f5b000;
    }
    .product-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .product-card {
      display: flex;
      align-items: center;
      background-color: #1c1c1c;
      border: 1px solid #2e2e2e;
      border-radius: 16px;
      padding: 14px;
      text-decoration: none;
      color: #ffffff;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }
    .product-card:hover, .product-card:active {
      transform: translateY(-2px);
      border-color: #f5b000;
    }
    .product-img {
      width: 80px;
      height: 80px;
      border-radius: 12px;
      object-fit: cover;
      background-color: #2a2a2a;
      margin-right: 16px;
      flex-shrink: 0;
    }
    .product-info {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .badge {
      display: inline-block;
      background-color: #3a2e0b;
      color: #f5b000;
      font-weight: 700;
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 6px;
      width: fit-content;
    }
    .title {
      font-size: 16px;
      font-weight: 700;
      line-height: 1.35;
      color: #f1f1f1;
    }
    .footer {
      margin-top: 36px;
      color: #777;
      font-size: 12px;
      text-align: center;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>스마트세이버 추천 꿀템</h1>
    <div class="subtitle">쇼츠에서 보신 제품의 번호를 검색하거나 골라보세요!</div>
    <input type="text" id="searchInput" class="search-box" placeholder="🔍 상품 번호 (예: 42) 또는 키워드 검색">
    <div id="productList" class="product-list"></div>
    <div class="footer">
      "이 포스팅은 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다."
    </div>
  </div>

  <script>
    let allProducts = [];

    async function loadProducts() {
      try {
        const res = await fetch('products.json?t=' + new Date().getTime());
        if (!res.ok) throw new Error('상품 데이터 요청 실패');
        const data = await res.json();
        allProducts = data.filter(p => p.verified === true &&
          p.image && !/1584622650111|1556911220/.test(p.image) &&
          Array.isArray(p.scenes) && p.scenes.length === 3 &&
          p.scenes.every(s => s.image && !/1584622650111|1556911220/.test(s.image)) &&
          new Set(p.scenes.map(s => s.image)).size === 3);
        renderProducts(allProducts);
      } catch (e) {
        console.error('상품 데이터를 불러오지 못했습니다:', e);
      }
    }

    function renderProducts(products) {
      const list = document.getElementById('productList');
      list.innerHTML = '';
      products.forEach(p => {
        const imgUrl = p.image;
        
        const card = document.createElement('a');
        let destination;
        try { destination = new URL(p.link); } catch { return; }
        if (destination.protocol !== 'https:') return;
        card.href = destination.href;
        card.target = '_blank';
        card.rel = 'noopener noreferrer sponsored';
        card.className = 'product-card';
        const image = document.createElement('img');
        image.src = imgUrl;
        image.alt = p.title;
        image.className = 'product-img';
        image.onerror = () => { image.hidden = true; };
        const info = document.createElement('div');
        info.className = 'product-info';
        const badge = document.createElement('span');
        badge.className = 'badge';
        badge.textContent = `NO. ${p.id}`;
        const title = document.createElement('div');
        title.className = 'title';
        title.textContent = p.title;
        info.append(badge, title);
        card.append(image, info);
        list.appendChild(card);
      });
    }

    document.getElementById('searchInput').addEventListener('input', (e) => {
      const q = e.target.value.trim().toLowerCase();
      const filtered = allProducts.filter(p => 
        String(p.id).includes(q) || (p.title && p.title.toLowerCase().includes(q))
      );
      renderProducts(filtered);
    });

    loadProducts();
  </script>
</body>
</html>
