<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>스마트세이버 추천 꿀템</title>
  <style>
    body {
      background-color: #121212;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      margin: 0;
      padding: 30px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container {
      width: 100%;
      max-width: 480px;
    }
    h1 {
      color: #f5b000;
      text-align: center;
      font-size: 26px;
      margin-bottom: 8px;
    }
    .subtitle {
      color: #a0a0a0;
      text-align: center;
      font-size: 14px;
      margin-bottom: 24px;
    }
    .search-box {
      width: 100%;
      padding: 14px 18px;
      border-radius: 30px;
      border: 1px solid #333;
      background-color: #1e1e1e;
      color: #fff;
      font-size: 15px;
      box-sizing: border-box;
      margin-bottom: 24px;
      outline: none;
    }
    .search-box:focus {
      border-color: #f5b000;
    }
    .product-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .product-card {
      display: flex;
      align-items: center;
      background-color: #1c1c1c;
      border: 1px solid #2e2e2e;
      border-radius: 16px;
      padding: 14px;
      text-decoration: none;
      color: #ffffff;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }
    .product-card:hover, .product-card:active {
      transform: translateY(-2px);
      border-color: #f5b000;
    }
    .product-img {
      width: 80px;
      height: 80px;
      border-radius: 12px;
      object-fit: cover;
      background-color: #2a2a2a;
      margin-right: 16px;
      flex-shrink: 0;
    }
    .product-info {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .badge {
      display: inline-block;
      background-color: #3a2e0b;
      color: #f5b000;
      font-weight: 700;
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 6px;
      width: fit-content;
    }
    .title {
      font-size: 16px;
      font-weight: 700;
      line-height: 1.35;
      color: #f1f1f1;
    }
    .footer {
      margin-top: 36px;
      color: #777;
      font-size: 12px;
      text-align: center;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>스마트세이버 추천 꿀템</h1>
    <div class="subtitle">쇼츠에서 보신 제품의 번호를 검색하거나 골라보세요!</div>
    <input type="text" id="searchInput" class="search-box" placeholder="🔍 상품 번호 (예: 42) 또는 키워드 검색">
    <div id="productList" class="product-list"></div>
    <div class="footer">
      "이 포스팅은 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다."
    </div>
  </div>

  <script>
    let allProducts = [];

    async function loadProducts() {
      try {
        const res = await fetch('products.json?t=' + new Date().getTime());
        allProducts = await res.json();
        renderProducts(allProducts);
      } catch (e) {
        console.error('상품 데이터를 불러오지 못했습니다:', e);
      }
    }

    function renderProducts(products) {
      const list = document.getElementById('productList');
      list.innerHTML = '';
      products.forEach(p => {
        const imgUrl = p.image && p.image.trim() !== '' 
          ? p.image 
          : 'https://images.unsplash.com/photo-1584622650111-993a426fbf0a?w=300&auto=format&fit=crop&q=80';
        
        const card = document.createElement('a');
        card.href = p.link || '#';
        card.target = '_blank';
        card.className = 'product-card';
        card.innerHTML = `
          <img src="${imgUrl}" alt="${p.title}" class="product-img" onerror="this.src='https://images.unsplash.com/photo-1556911220-e15b29be8c8f?w=300&auto=format&fit=crop&q=80'">
          <div class="product-info">
            <span class="badge">NO. ${p.id}</span>
            <div class="title">${p.title}</div>
          </div>
        `;
        list.appendChild(card);
      });
    }

    document.getElementById('searchInput').addEventListener('input', (e) => {
      const q = e.target.value.trim().toLowerCase();
      const filtered = allProducts.filter(p => 
        String(p.id).includes(q) || (p.title && p.title.toLowerCase().includes(q))
      );
      renderProducts(filtered);
    });

    loadProducts();
  </script>
</body>
</html>
